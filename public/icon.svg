<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0b172d"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Candlesticks / Trading Grid lines -->
  <line x1="100" y1="120" x2="100" y2="400" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="200" y1="120" x2="200" y2="400" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="300" y1="120" x2="300" y2="400" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="400" y1="120" x2="400" y2="400" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4"/>

  <line x1="80" y1="360" x2="432" y2="360" stroke="#1e293b" stroke-width="2"/>
  <line x1="80" y1="280" x2="432" y2="280" stroke="#1e293b" stroke-width="2"/>
  <line x1="80" y1="200" x2="432" y2="200" stroke="#1e293b" stroke-width="2"/>

  <!-- Upward Trend Line -->
  <path d="M 90 340 L 180 270 L 260 300 L 350 180 L 425 150" fill="none" stroke="url(#chartGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Target Point -->
  <circle cx="425" cy="150" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="425" cy="150" r="8" fill="#ffffff"/>

  <!-- Trade Recovery Badge / Coins symbol bottom-right -->
  <g transform="translate(320, 290)">
    <circle cx="45" cy="45" r="42" fill="#0b172d" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="45" cy="45" r="34" fill="url(#goldGrad)"/>
    <text x="45" y="55" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#78350f" text-anchor="middle">₹</text>
  </g>

  <!-- TradeSizer Brand Title Text inside Icon -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#38bdf8" letter-spacing="2" text-anchor="middle">TRADESIZER</text>
</svg>
